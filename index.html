<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Układ z Blokiem Bocznym</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-left: 1px solid black;
            border-right: 1px solid black;
        }

        .nav-block {
            height: 70px;
            border-top: 1px solid black;
            border-bottom: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .main-block-wrapper {
            display: flex;
            flex-grow: 1; /* Wypełnia resztę wysokości */
            border-bottom: 1px solid black;
        }

        .aside-block {
            width: 30%; /* Blok boczny zajmuje 30% szerokości */
            height: 100%;
            border-right: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            padding: 10px;
            text-align: center;
            box-sizing: border-box;
        }

        .section-block {
            width: 70%; /* Sekcja zajmuje pozostałe 70% szerokości */
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            padding: 10px;
            text-align: center;
            box-sizing: border-box;
        }

        .footer {
            height: 70px;
            border-bottom: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-block">Blok nawigacyjny</div>
        
        <div class="main-block-wrapper">
            <div class="aside-block">Blok boczny</div>
            
            <div class="section-block">Sekcja</div>
        </div>

        <div class="footer">Blok stopki</div>
    </div>

</body>
</html>
